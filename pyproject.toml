[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bosonic-entanglement-distillation"
version = "0.1.0"
description = "Simulation tools for bosonic entanglement distillation."
readme = "readme.md"
requires-python = ">=3.9,<3.12"
dependencies = [
  "mpmath==1.4.0",
  "numpy==1.26.4",
  "qutip==4.7.2",
  "scipy==1.10.0",
]

[project.optional-dependencies]
notebooks = [
  "dill",
  "ipython",
  "matplotlib",
  "multiprocess",
  "nbclient",
  "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "continuous",
  "discrete_simulation",
  "measurements",
  "other_measurements",
  "qudit",
]
